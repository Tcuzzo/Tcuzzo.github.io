<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>BACKS AIOS share card — research</title>
<!-- Renders the 1200x630 social share card at assets/og-card-research.png.
     Consumes the same dark-theme tokens as research/tokens.css; no raw hex.
     Regenerate: google-chrome --headless=new --window-size=1200,630 \
       --screenshot=assets/og-card-research.png assets/og-card-research.html -->
<style>
:root{
  --paper:oklch(0.17 0.02 245); --panel:oklch(0.225 0.022 245);
  --ink:oklch(0.94 0.012 83); --ink-soft:oklch(0.76 0.02 240);
  --cyan:oklch(0.78 0.12 207); --line:oklch(0.43 0.03 240);
  --font-display:"Nimbus Sans Narrow","Arial Narrow",sans-serif;
  --font-body:"C059","Century Schoolbook",serif;
  --s2:8px; --s4:16px; --s6:24px; --s8:32px; --s12:48px; --s16:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);
  display:grid;grid-template-columns:1fr 430px;border-top:10px solid var(--cyan)}
.copy{padding:var(--s16) var(--s12) var(--s12) var(--s16);display:flex;
  flex-direction:column;justify-content:center;gap:var(--s6)}
.eyebrow{font-family:var(--font-display);font-size:21px;letter-spacing:.16em;
  color:var(--cyan);font-weight:700}
.title{font-family:var(--font-display);font-size:76px;line-height:.98;
  font-weight:700;letter-spacing:-.02em;max-width:15ch;text-wrap:balance}
.rule{width:96px;height:4px;background:var(--cyan)}
.deck{font-size:27px;line-height:1.3;color:var(--ink-soft);max-width:26ch}
.meta{font-family:var(--font-display);font-size:19px;color:var(--ink-soft);
  letter-spacing:.04em;display:flex;gap:var(--s6);padding-top:var(--s4);
  border-top:1px solid var(--line)}
.art{position:relative;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.art::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,var(--paper) 0%,oklch(0.17 0.02 245/.5) 30%,transparent 68%)}
</style></head>
<body>
  <div class="copy">
    <p class="eyebrow">THE RESEARCH &amp; ORIGIN STORY</p>
    <h1 class="title">The Machine That Comes Down to Meet You</h1>
    <div class="rule"></div>
    <p class="deck">A product review, a systems study and an architecture biography.</p>
    <p class="meta"><span>24 figures &amp; captures</span><span>Public web edition</span></p>
  </div>
  <figure class="art"><img src="../research/figures/backs-operating-body-editorial.png" alt=""></figure>
</body></html>
