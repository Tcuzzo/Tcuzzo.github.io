<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>BACKS AIOS share card — landing</title>
<!-- Renders the 1200x630 social share card at assets/og-card.png.
     Consumes the same dark-theme tokens as research/tokens.css; no raw hex.
     Regenerate: google-chrome --headless=new --window-size=1200,630 \
       --screenshot=assets/og-card.png assets/og-card.html -->
<style>
:root{
  --paper:oklch(0.17 0.02 245); --panel:oklch(0.225 0.022 245);
  --ink:oklch(0.94 0.012 83); --ink-soft:oklch(0.76 0.02 240);
  --cyan:oklch(0.78 0.12 207); --line:oklch(0.43 0.03 240);
  --font-display:"Nimbus Sans Narrow","Arial Narrow",sans-serif;
  --font-body:"C059","Century Schoolbook",serif;
  --s2:8px; --s4:16px; --s6:24px; --s8:32px; --s12:48px; --s16:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);
  display:grid;grid-template-columns:1fr 470px;border-top:10px solid var(--cyan)}
.copy{padding:var(--s16) var(--s12) var(--s12) var(--s16);display:flex;
  flex-direction:column;justify-content:center;gap:var(--s6)}
.eyebrow{font-family:var(--font-display);font-size:21px;letter-spacing:.16em;
  color:var(--cyan);font-weight:700}
.wordmark{font-family:var(--font-display);font-size:104px;line-height:.92;
  font-weight:700;letter-spacing:-.02em}
.wordmark span{color:var(--cyan);font-size:46px;letter-spacing:.06em;
  display:inline-block;vertical-align:.42em;margin-left:var(--s4)}
.thesis{font-size:38px;line-height:1.18;max-width:19ch;text-wrap:balance}
.rule{width:96px;height:4px;background:var(--cyan)}
.byline{font-family:var(--font-display);font-size:20px;color:var(--ink-soft);
  letter-spacing:.04em}
.art{position:relative;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.art::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,var(--paper) 0%,oklch(0.17 0.02 245/.55) 34%,transparent 72%)}
</style></head>
<body>
  <div class="copy">
    <p class="eyebrow">PRIVATE INTELLIGENCE. PUBLIC PROOF.</p>
    <h1 class="wordmark">B.A.C.K.S<span>AIOS</span></h1>
    <div class="rule"></div>
    <p class="thesis">The machine comes down to meet you.</p>
    <p class="byline">A private agent operating system · Truitt &ldquo;Cuzzo&rdquo;</p>
  </div>
  <figure class="art"><img src="background.webp" alt=""></figure>
</body></html>
