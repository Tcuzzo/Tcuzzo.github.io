<text x="76.0" y="100" fill="oklch(0.94 0.012 83)" font-size="20" font-weight="700" letter-spacing="0.07em">DETERMINISTIC RUNTIME</text>
<text x="76.0" y="126" fill="oklch(0.76 0.02 240)" font-size="15">It owns the state, the lookups and the rules.</text>
