<rect x="48.0" y="520" width="1184.0" height="58" rx="10" fill="oklch(0.285 0.024 245)" stroke="oklch(0.69 0.16 48)" stroke-width="1.5"/>
<text x="640.0" y="556" fill="oklch(0.94 0.012 83)" font-size="16.5" font-weight="600" text-anchor="middle">If the model tries to change state without permission, the seam refuses it out loud. It never guesses quietly.</text>
