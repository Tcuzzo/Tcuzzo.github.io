<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" width="1280" height="590" role="img" aria-labelledby="title desc">
<title id="title">The Reflex Seam</title>
<desc id="desc">A deterministic runtime on the left holds state, files, rules and tests. A model judgment kernel on the right holds inference, policy, reversibility and priority. A jagged seam runs between them. Decision signals cross from the model to the runtime. State updates cross back from the runtime to the model. An unpermitted state change is refused loudly at the seam.</desc>
<rect width="1280" height="590" fill="oklch(0.17 0.02 245)"/>
<g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
