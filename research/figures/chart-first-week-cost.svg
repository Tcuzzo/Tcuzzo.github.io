<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">First-week operating-mode cost model</title><desc id="d">Horizontal bar chart of December 2025 estimated costs for solo, consensus, and debate modes.</desc><style>:root{--paper:#f8f3e9;--ink:#17202a;--muted:#59636d;--cyan:#15a7bf;--cyan2:#0b6579;--orange:#d86f25;--green:#2d8564;--line:#afbcc4;--white:#fff}text{font-family:"Nimbus Sans Narrow",Arial,sans-serif;fill:var(--ink)}.title{font-size:34px;font-weight:700;letter-spacing:.5px}.sub{font-size:18px;fill:var(--muted)}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--white);stroke:var(--line);stroke-width:2}.signal{fill:var(--cyan);stroke:var(--cyan2);stroke-width:2}.accent{fill:var(--orange)}.ok{fill:var(--green)}.wire{fill:none;stroke:var(--cyan2);stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b6579"/></marker></defs><rect width="100%" height="100%" fill="#f8f3e9"/><text class="title" x="70" y="70">Cost was an architectural input in the first week</text><text class="sub" x="70" y="106">Documented December 2025 estimates per operating mode; shown as relative call cost, not current pricing.</text><text class="label" x="90" y="245">Solo</text><rect x="260" y="210" width="158" height="62" rx="8" class="signal"/><text x="438" y="248" style="font-size:22px;font-weight:700">$0.001–$0.003</text><text class="small" x="260" y="300">one model call</text><text class="label" x="90" y="395">Consensus</text><rect x="260" y="360" width="316" height="62" rx="8" class="signal"/><text x="596" y="398" style="font-size:22px;font-weight:700">$0.006</text><text class="small" x="260" y="450">four model calls</text><text class="label" x="90" y="545">Debate</text><rect x="260" y="510" width="950" height="62" rx="8" class="accent"/><text x="1230" y="548" style="font-size:22px;font-weight:700">$0.018</text><text class="small" x="260" y="600">twelve model calls</text><text class="small" x="90" y="720">Source: surviving December 5, 2025 README. The referee adapter was documented at a fraction of the generator cost.</text></svg>