<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" role="img" aria-labelledby="t d"><title id="t">From a request to working production</title><desc id="d">The build state machine and promotion route have different responsibilities.</desc><style>:root{--paper:#f8f3e9;--ink:#17202a;--muted:#59636d;--cyan:#15a7bf;--cyan2:#0b6579;--orange:#d86f25;--green:#2d8564;--line:#afbcc4;--white:#fff}text{font-family:"Nimbus Sans Narrow",Arial,sans-serif;fill:var(--ink)}.title{font-size:34px;font-weight:700;letter-spacing:.5px}.sub{font-size:18px;fill:var(--muted)}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--white);stroke:var(--line);stroke-width:2}.signal{fill:var(--cyan);stroke:var(--cyan2);stroke-width:2}.accent{fill:var(--orange)}.ok{fill:var(--green)}.wire{fill:none;stroke:var(--cyan2);stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 7}text{font-size:23px}.label{font-size:25px}.small{font-size:21px}.sub{font-size:22px}.title{font-size:34px}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="var(--cyan2)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="45" y="60" class="title">From a request to working production</text><text x="45" y="99" class="sub">The build state machine and promotion route have different responsibilities.</text><rect class="box" x="45" y="145" width="310" height="150" rx="12"/><text x="65" y="183" class="label">REQUEST + SCOPE</text><text x="65" y="220" class="small">Preflight and inspect</text><text x="65" y="248" class="small">Read code + lessons</text><text x="65" y="276" class="small">Research where needed</text><path class="wire" d="M365,220 L390,220"/><rect class="box" x="400" y="145" width="310" height="150" rx="12"/><text x="420" y="183" class="label">BUILD + TEST</text><text x="420" y="220" class="small">Generate scoped edits</text><text x="420" y="248" class="small">Apply transactionally</text><text x="420" y="276" class="small">Test ↔ repair / retest</text><path class="wire" d="M720,220 L745,220"/><rect class="box" x="755" y="145" width="320" height="150" rx="12"/><text x="775" y="183" class="label">REVIEW + CANDIDATE</text><text x="775" y="220" class="small">Independent review</text><text x="775" y="248" class="small">Report, verify, finalize</text><text x="775" y="276" class="small">Persist terminal state</text><path class="wire" d="M915,305 L915,380"/><rect class="box" x="590" y="390" width="485" height="165" rx="12"/><text x="610" y="428" class="label">PRODUCTION PROMOTION</text><text x="610" y="465" class="small">Freeze candidate + evidence</text><text x="610" y="493" class="small">Tribunal and receipt verification</text><text x="610" y="521" class="small">Atomic proven-reference update</text><path class="wire" d="M580,470 L530,470"/><rect class="box" x="45" y="390" width="475" height="165" rx="12"/><text x="65" y="428" class="label">DEPLOY + OPERATOR PROOF</text><text x="65" y="465" class="small">Consume the proven reference</text><text x="65" y="493" class="small">Sanctioned restart + health checks</text><text x="65" y="521" class="small">Demonstrate the real working surface</text><text x="45" y="630" class="label">BLOCKED and FAILED remain visible; they are not DONE</text><text x="45" y="675" class="small">Results, lessons and exact source pointers feed the next attempt.</text></svg>