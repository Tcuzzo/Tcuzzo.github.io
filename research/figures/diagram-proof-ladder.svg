<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">BACKS verification economy</title><desc id="d">A four-level ladder from deterministic checks through real-seam tests and cross-family review to a live operator path.</desc><style>:root{--paper:#f8f3e9;--ink:#17202a;--muted:#59636d;--cyan:#15a7bf;--cyan2:#0b6579;--orange:#d86f25;--green:#2d8564;--line:#afbcc4;--white:#fff}text{font-family:"Nimbus Sans Narrow",Arial,sans-serif;fill:var(--ink)}.title{font-size:34px;font-weight:700;letter-spacing:.5px}.sub{font-size:18px;fill:var(--muted)}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--white);stroke:var(--line);stroke-width:2}.signal{fill:var(--cyan);stroke:var(--cyan2);stroke-width:2}.accent{fill:var(--orange)}.ok{fill:var(--green)}.wire{fill:none;stroke:var(--cyan2);stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b6579"/></marker></defs><rect width="100%" height="100%" fill="#f8f3e9"/><text class="title" x="70" y="70">The verification economy</text><text class="sub" x="70" y="106">Spend certainty first and expensive judgment only where semantics require it.</text><rect class="accent" x="90" y="560" width="1220" height="100" rx="12"/><text class="label" x="112" y="594">LIVE OPERATOR PATH</text><text class="small" x="112" y="622">Can the human trigger the real behavior on the real surface?</text><rect class="signal" x="180" y="430" width="1040" height="95" rx="12"/><text class="label" x="202" y="464">CROSS-FAMILY TRIBUNAL</text><text class="small" x="202" y="492">Can a disjoint reviewer refute the claim?</text><rect class="box" x="270" y="305" width="860" height="90" rx="12"/><text class="label" x="292" y="339">REAL-SEAM TESTS</text><text class="small" x="292" y="367">Do files, rows, sockets, and DOM effects actually appear?</text><rect class="box" x="360" y="190" width="680" height="82" rx="12"/><text class="label" x="382" y="224">DETERMINISTIC CHECKS</text><text class="small" x="382" y="252">Schema • hashes • classifiers • invariants</text><text class="label" x="70" y="740">A green unit test is necessary. It is never the whole proof.</text></svg>