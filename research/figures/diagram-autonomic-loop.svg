<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" role="img" aria-labelledby="t d"><title id="t">The loop is bounded; the model still thinks</title><desc id="d">Control rules are repeatable. Judgment is evaluated, not assumed identical.</desc><style>:root{--paper:#f8f3e9;--ink:#17202a;--muted:#59636d;--cyan:#15a7bf;--cyan2:#0b6579;--orange:#d86f25;--green:#2d8564;--line:#afbcc4;--white:#fff}text{font-family:"Nimbus Sans Narrow",Arial,sans-serif;fill:var(--ink)}.title{font-size:34px;font-weight:700;letter-spacing:.5px}.sub{font-size:18px;fill:var(--muted)}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--white);stroke:var(--line);stroke-width:2}.signal{fill:var(--cyan);stroke:var(--cyan2);stroke-width:2}.accent{fill:var(--orange)}.ok{fill:var(--green)}.wire{fill:none;stroke:var(--cyan2);stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 7}text{font-size:23px}.label{font-size:25px}.small{font-size:21px}.sub{font-size:22px}.title{font-size:34px}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="var(--cyan2)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="45" y="60" class="title">The loop is bounded; the model still thinks</text><text x="45" y="99" class="sub">Control rules are repeatable. Judgment is evaluated, not assumed identical.</text><rect class="box" x="45" y="150" width="475" height="150" rx="12"/><text x="65" y="188" class="label">1 / DETERMINISTIC PREPARATION</text><text x="65" y="225" class="small">Schedule → task and checkpoint</text><text x="65" y="253" class="small">Resolve method, tools and resource map</text><text x="65" y="281" class="small">Load current state; allocate budgets</text><path class="wire" d="M530,225 L580,225"/><rect class="box" x="590" y="150" width="485" height="150" rx="12"/><text x="610" y="188" class="label">2 / REASONING KERNEL</text><text x="610" y="225" class="small">Research, diagnose, generate, synthesize</text><text x="610" y="253" class="small">Use the configured model lane</text><text x="610" y="281" class="small">Return typed work, not a success story</text><path class="wire" d="M835,310 L835,370"/><rect class="box" x="590" y="380" width="485" height="160" rx="12"/><text x="610" y="418" class="label">3 / DETERMINISTIC CHECKS</text><text x="610" y="455" class="small">Schema, scope, call budget, state</text><text x="610" y="483" class="small">Real files / rows / tool outcomes</text><text x="610" y="511" class="small">Separate review where judgment is needed</text><path class="wire" d="M580,460 L530,460"/><rect class="box" x="45" y="380" width="475" height="160" rx="12"/><text x="65" y="418" class="label">4 / HONEST TRANSITION</text><text x="65" y="455" class="small">Valid result → persist + show the operator</text><text x="65" y="483" class="small">Failure → bounded repair / handoff</text><text x="65" y="511" class="small">Budget exhausted → checkpoint, not vanish</text><path class="wire" d="M280,370 L280,310"/><text x="45" y="615" class="label">AUTONOMIC = the runtime fires the rule; no reminder prompt</text><text x="45" y="660" class="small">HYBRID = exact control shell + an explicitly evaluated judgment step</text></svg>