<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">BACKS origin timeline</title><desc id="d">Timeline from the earliest surviving multi-model comparison engine through the present public product polish.</desc><style>:root{--paper:#f8f3e9;--ink:#17202a;--muted:#59636d;--cyan:#15a7bf;--cyan2:#0b6579;--orange:#d86f25;--green:#2d8564;--line:#afbcc4;--white:#fff}text{font-family:"Nimbus Sans Narrow",Arial,sans-serif;fill:var(--ink)}.title{font-size:34px;font-weight:700;letter-spacing:.5px}.sub{font-size:18px;fill:var(--muted)}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--white);stroke:var(--line);stroke-width:2}.signal{fill:var(--cyan);stroke:var(--cyan2);stroke-width:2}.accent{fill:var(--orange)}.ok{fill:var(--green)}.wire{fill:none;stroke:var(--cyan2);stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b6579"/></marker></defs><rect width="100%" height="100%" fill="#f8f3e9"/><text class="title" x="70" y="75">From comparison engine to agent operating system</text><text class="sub" x="70" y="110">Surviving evidence establishes a continuity of problems, not a claim that every later organ existed on day one.</text><circle cx="160" cy="280" r="19" class="accent"/><text class="label" x="90" y="340">DEC 2025</text><text class="small" x="90" y="372">MULTI-MODEL ENGINE</text><text class="small" x="90" y="400">debate · judge · cost</text><path class="wire" d="M185,280 H382"/><circle cx="410" cy="280" r="19" class="signal"/><text class="label" x="340" y="340">EARLY 2026</text><text class="small" x="340" y="372">BODY TAKES SHAPE</text><text class="small" x="340" y="400">memory · agents · loops</text><path class="wire" d="M435,280 H632"/><circle cx="660" cy="280" r="19" class="signal"/><text class="label" x="590" y="340">MID 2026</text><text class="small" x="590" y="372">HARNESS BECOMES LAW</text><text class="small" x="590" y="400">hooks bind the work</text><path class="wire" d="M685,280 H882"/><circle cx="910" cy="280" r="19" class="signal"/><text class="label" x="840" y="340">AUG 2026</text><text class="small" x="840" y="372">PUBLIC PRODUCT RECORD</text><text class="small" x="840" y="400">control-plane surfaces</text><path class="wire" d="M935,280 H1132"/><circle cx="1160" cy="280" r="19" class="signal"/><text class="label" x="1090" y="340">SEP 2026</text><text class="small" x="1090" y="372">POLISH + MEASURE</text><text class="small" x="1090" y="400">public research draft</text><path class="dash" d="M160 500 H1160"/><text class="label" x="80" y="555">The invariant thread</text><text class="sub" x="80" y="595">One answer is not enough. The judge cannot be the player. Failure must be loud. Method should survive the model.</text><text class="small" x="80" y="690">Source: earliest surviving archive, project record, and dated public editions.</text></svg>