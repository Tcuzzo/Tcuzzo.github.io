<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">BACKS harness-first boot</title><desc id="d">Five-step flow from session RED through contract and skill loading to GREEN and later re-arm.</desc><style>:root{--paper:#f8f3e9;--ink:#17202a;--muted:#59636d;--cyan:#15a7bf;--cyan2:#0b6579;--orange:#d86f25;--green:#2d8564;--line:#afbcc4;--white:#fff}text{font-family:"Nimbus Sans Narrow",Arial,sans-serif;fill:var(--ink)}.title{font-size:34px;font-weight:700;letter-spacing:.5px}.sub{font-size:18px;fill:var(--muted)}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--white);stroke:var(--line);stroke-width:2}.signal{fill:var(--cyan);stroke:var(--cyan2);stroke-width:2}.accent{fill:var(--orange)}.ok{fill:var(--green)}.wire{fill:none;stroke:var(--cyan2);stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b6579"/></marker></defs><rect width="100%" height="100%" fill="#f8f3e9"/><text class="title" x="70" y="70">Harness-first boot: discipline before mutation</text><text class="sub" x="70" y="106">A deterministic gate turns a remembered rule into a session condition. It binds the agent, not the operator.</text><circle cx="104" cy="265" r="30" class="accent"/><text x="97" y="273" style="font-size:24px;font-weight:700;fill:white">1</text><rect class="box" x="70" y="325" width="220" height="118" rx="12"/><text class="label" x="92" y="359">SESSION RED</text><text class="small" x="92" y="387">read-only exploration remains open</text><path class="wire" d="M134,265 H300"/><circle cx="364" cy="265" r="30" class="signal"/><text x="357" y="273" style="font-size:24px;font-weight:700;fill:white">2</text><rect class="box" x="330" y="325" width="220" height="118" rx="12"/><text class="label" x="352" y="359">LOAD FLOOR</text><text class="small" x="352" y="387">contracts, map, human profile</text><path class="wire" d="M394,265 H560"/><circle cx="624" cy="265" r="30" class="signal"/><text x="617" y="273" style="font-size:24px;font-weight:700;fill:white">3</text><rect class="box" x="590" y="325" width="220" height="118" rx="12"/><text class="label" x="612" y="359">INVOKE SKILLS</text><text class="small" x="612" y="387">the methods this job actually needs</text><path class="wire" d="M654,265 H820"/><circle cx="884" cy="265" r="30" class="signal"/><text x="877" y="273" style="font-size:24px;font-weight:700;fill:white">4</text><rect class="box" x="850" y="325" width="220" height="118" rx="12"/><text class="label" x="872" y="359">SESSION GREEN</text><text class="small" x="872" y="387">bounded mutation may begin</text><path class="wire" d="M914,265 H1080"/><circle cx="1144" cy="265" r="30" class="accent"/><text x="1137" y="273" style="font-size:24px;font-weight:700;fill:white">5</text><rect class="box" x="1110" y="325" width="220" height="118" rx="12"/><text class="label" x="1132" y="359">RE-ARM</text><text class="small" x="1132" y="387">new job, handoff, or context reset</text><rect x="70" y="545" width="1260" height="120" rx="12" fill="#fff" stroke="#afbcc4" stroke-width="2"/><text class="label" x="100" y="585">What the hook is — and is not</text><text class="sub" x="100" y="620">It is a grounding gate: deterministic, free, narrow, loud on failure. It is not a claim of complete sandboxing.</text><text class="small" x="100" y="650">Human-owned kill switch • read-only work never blocked • no second authority gate • session state written atomically</text></svg>