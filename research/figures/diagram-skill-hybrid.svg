<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" role="img" aria-labelledby="t d"><title id="t">How outside knowledge becomes native practice</title><desc id="d">Two tracks; different claims of trust.</desc><style>:root{--paper:#f8f3e9;--ink:#17202a;--muted:#59636d;--cyan:#15a7bf;--cyan2:#0b6579;--orange:#d86f25;--green:#2d8564;--line:#afbcc4;--white:#fff}text{font-family:"Nimbus Sans Narrow",Arial,sans-serif;fill:var(--ink)}.title{font-size:34px;font-weight:700;letter-spacing:.5px}.sub{font-size:18px;fill:var(--muted)}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--white);stroke:var(--line);stroke-width:2}.signal{fill:var(--cyan);stroke:var(--cyan2);stroke-width:2}.accent{fill:var(--orange)}.ok{fill:var(--green)}.wire{fill:none;stroke:var(--cyan2);stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 7}text{font-size:23px}.label{font-size:25px}.small{font-size:21px}.sub{font-size:22px}.title{font-size:34px}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="var(--cyan2)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="45" y="60" class="title">How outside knowledge becomes native practice</text><text x="45" y="99" class="sub">Two tracks; different claims of trust.</text><rect class="box" x="45" y="150" width="290" height="160" rx="12"/><text x="65" y="188" class="label">DISCOVER</text><text x="65" y="225" class="small">Local → directory → GitHub</text><text x="65" y="253" class="small">License / activity signals</text><text x="65" y="281" class="small">README-derived candidate</text><path class="wire" d="M345,226 L400,226"/><rect class="box" x="410" y="150" width="280" height="160" rx="12"/><text x="430" y="188" class="label">UNVERIFIED</text><text x="430" y="225" class="small">Source reference retained</text><text x="430" y="253" class="small">Evaluate before trust</text><text x="430" y="281" class="small">Not a certified capability</text><rect class="box" x="45" y="370" width="290" height="180" rx="12"/><text x="65" y="408" class="label">ABSORB</text><text x="65" y="445" class="small">Inspect the real capability</text><text x="65" y="473" class="small">Preserve / reuse / rebuild</text><text x="65" y="501" class="small">Refute with evidence</text><text x="65" y="529" class="small">Keep scaffold credit</text><path class="wire" d="M345,457 L400,457"/><rect class="box" x="410" y="370" width="280" height="180" rx="12"/><text x="430" y="408" class="label">NATIVE BINDING</text><text x="430" y="445" class="small">Tools + memory lanes</text><text x="430" y="473" class="small">Agent-specific method</text><text x="430" y="501" class="small">Real behavior checks</text><path class="wire" d="M700,226 L780,320"/><path class="wire" d="M700,457 L780,385"/><rect class="box" x="790" y="230" width="285" height="230" rx="12"/><text x="810" y="268" class="label">RUNTIME BUNDLE</text><text x="810" y="305" class="small">Applicable plays selected</text><text x="810" y="333" class="small">Ordered skill sources</text><text x="810" y="361" class="small">Local byte identity</text><text x="810" y="389" class="small">Bounded context delivery</text><text x="810" y="417" class="small">Model reasons within it</text><text x="45" y="630" class="label">Local hash ≠ upstream provenance ≠ behavioral proof</text><text x="45" y="672" class="small">Deterministic selection and bounds surround model judgment.</text></svg>