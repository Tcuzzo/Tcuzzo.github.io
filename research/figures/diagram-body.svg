<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">BACKS body architecture</title><desc id="d">A central model and fleet surrounded by YOKE, memory, harness, proof, agents, loops, routing, and skills.</desc><style>:root{--paper:#f8f3e9;--ink:#17202a;--muted:#59636d;--cyan:#15a7bf;--cyan2:#0b6579;--orange:#d86f25;--green:#2d8564;--line:#afbcc4;--white:#fff}text{font-family:"Nimbus Sans Narrow",Arial,sans-serif;fill:var(--ink)}.title{font-size:34px;font-weight:700;letter-spacing:.5px}.sub{font-size:18px;fill:var(--muted)}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--white);stroke:var(--line);stroke-width:2}.signal{fill:var(--cyan);stroke:var(--cyan2);stroke-width:2}.accent{fill:var(--orange)}.ok{fill:var(--green)}.wire{fill:none;stroke:var(--cyan2);stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b6579"/></marker></defs><rect width="100%" height="100%" fill="#f8f3e9"/><text class="title" x="70" y="70">The BODY: intelligence distributed around the model</text><text class="sub" x="70" y="106">The model generates. The surrounding organs preserve intent, memory, authority, economy, and proof.</text><rect class="signal" x="560" y="300" width="280" height="130" rx="12"/><text class="label" x="582" y="334">MODEL / FLEET</text><text class="small" x="582" y="362">replaceable reasoning resource</text><rect class="box" x="90" y="180" width="230" height="92" rx="12"/><text class="label" x="112" y="214">YOKE</text><text class="small" x="112" y="242">meet the human</text><path class="wire" d="M205,272 Q700,400 700,365"/><rect class="box" x="90" y="430" width="230" height="92" rx="12"/><text class="label" x="112" y="464">MEMORY</text><text class="small" x="112" y="492">carry correction</text><path class="wire" d="M205,430 Q700,400 700,365"/><rect class="box" x="1030" y="180" width="230" height="92" rx="12"/><text class="label" x="1052" y="214">HARNESS</text><text class="small" x="1052" y="242">load method first</text><path class="wire" d="M1145,272 Q700,400 700,365"/><rect class="box" x="1030" y="430" width="230" height="92" rx="12"/><text class="label" x="1052" y="464">PROOF</text><text class="small" x="1052" y="492">refute before claim</text><path class="wire" d="M1145,430 Q700,400 700,365"/><rect class="box" x="430" y="580" width="230" height="92" rx="12"/><text class="label" x="452" y="614">AGENTS</text><text class="small" x="452" y="642">specialized roles</text><path class="wire" d="M545,580 Q700,400 700,365"/><rect class="box" x="720" y="580" width="230" height="92" rx="12"/><text class="label" x="742" y="614">LOOPS</text><text class="small" x="742" y="642">bounded continuity</text><path class="wire" d="M835,580 Q700,400 700,365"/><rect class="box" x="430" y="140" width="230" height="92" rx="12"/><text class="label" x="452" y="174">ROUTER</text><text class="small" x="452" y="202">fit task to lane</text><path class="wire" d="M545,232 Q700,400 700,365"/><rect class="box" x="720" y="140" width="230" height="92" rx="12"/><text class="label" x="742" y="174">SKILLS</text><text class="small" x="742" y="202">executable practice</text><path class="wire" d="M835,232 Q700,400 700,365"/><text class="small" x="70" y="760">Architecture reading: capability does not live in one weight file; it emerges from coordinated organs and their contracts.</text></svg>