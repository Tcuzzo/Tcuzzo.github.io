<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">BACKS knowledge graph explanation</title><desc id="d">Knowledge types arranged around turn recall: episodes, people and agents, claims, code and artifacts, lessons, and concepts.</desc><style>:root{--paper:#f8f3e9;--ink:#17202a;--muted:#59636d;--cyan:#15a7bf;--cyan2:#0b6579;--orange:#d86f25;--green:#2d8564;--line:#afbcc4;--white:#fff}text{font-family:"Nimbus Sans Narrow",Arial,sans-serif;fill:var(--ink)}.title{font-size:34px;font-weight:700;letter-spacing:.5px}.sub{font-size:18px;fill:var(--muted)}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--white);stroke:var(--line);stroke-width:2}.signal{fill:var(--cyan);stroke:var(--cyan2);stroke-width:2}.accent{fill:var(--orange)}.ok{fill:var(--green)}.wire{fill:none;stroke:var(--cyan2);stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b6579"/></marker></defs><rect width="100%" height="100%" fill="#f8f3e9"/><text class="title" x="70" y="70">Knowledge graph: memory becomes navigable structure</text><text class="sub" x="70" y="106">The graph is not decoration. It exposes how episodes, entities, concepts, code, and claims connect.</text><circle cx="700" cy="390" r="78" class="signal"/><text x="653" y="385" style="font-size:24px;font-weight:700;fill:white">RECALL</text><text x="651" y="415" style="font-size:17px;fill:white">for this turn</text><rect class="box" x="220" y="210" width="240" height="92" rx="12"/><text class="label" x="242" y="244">EPISODES</text><text class="small" x="242" y="272">what happened</text><path class="wire" d="M340,256 L700,390"/><rect class="box" x="220" y="560" width="240" height="92" rx="12"/><text class="label" x="242" y="594">PEOPLE + AGENTS</text><text class="small" x="242" y="622">who acted</text><path class="wire" d="M340,606 L700,390"/><rect class="box" x="560" y="150" width="240" height="92" rx="12"/><text class="label" x="582" y="184">CLAIMS</text><text class="small" x="582" y="212">what is asserted</text><path class="wire" d="M680,196 L700,390"/><rect class="box" x="980" y="210" width="240" height="92" rx="12"/><text class="label" x="1002" y="244">CODE + ARTIFACTS</text><text class="small" x="1002" y="272">where it lives</text><path class="wire" d="M1100,256 L700,390"/><rect class="box" x="980" y="560" width="240" height="92" rx="12"/><text class="label" x="1002" y="594">LESSONS</text><text class="small" x="1002" y="622">what changed</text><path class="wire" d="M1100,606 L700,390"/><rect class="box" x="560" y="630" width="240" height="92" rx="12"/><text class="label" x="582" y="664">CONCEPTS</text><text class="small" x="582" y="692">what it means</text><path class="wire" d="M680,676 L700,390"/><text class="small" x="70" y="755">Reading the live map: dense hubs are reused context; long branches are specialized histories; colored crowns identify typed categories.</text></svg>