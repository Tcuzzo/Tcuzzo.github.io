<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" role="img" aria-labelledby="t d"><title id="t">The private body and its public instruments</title><desc id="d">Publication boundaries checked September 5, 2026.</desc><style>:root{--paper:#f8f3e9;--ink:#17202a;--muted:#59636d;--cyan:#15a7bf;--cyan2:#0b6579;--orange:#d86f25;--green:#2d8564;--line:#afbcc4;--white:#fff}text{font-family:"Nimbus Sans Narrow",Arial,sans-serif;fill:var(--ink)}.title{font-size:34px;font-weight:700;letter-spacing:.5px}.sub{font-size:18px;fill:var(--muted)}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--white);stroke:var(--line);stroke-width:2}.signal{fill:var(--cyan);stroke:var(--cyan2);stroke-width:2}.accent{fill:var(--orange)}.ok{fill:var(--green)}.wire{fill:none;stroke:var(--cyan2);stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 7}text{font-size:23px}.label{font-size:25px}.small{font-size:21px}.sub{font-size:22px}.title{font-size:34px}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="var(--cyan2)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="45" y="60" class="title">The private body and its public instruments</text><text x="45" y="99" class="sub">Publication boundaries checked September 5, 2026.</text><rect class="box" x="45" y="145" width="440" height="185" rx="12"/><text x="65" y="183" class="label">PRIVATE OPERATING BODY</text><text x="65" y="220" class="small">BACKS: integrated personal AI OS</text><text x="65" y="248" class="small">HydraAgent: Sigma development peer</text><text x="65" y="276" class="small">CuzzoClaw: Beta wrapper + work lanes</text><text x="65" y="304" class="small">Operator accounts and personal memory</text><path class="wire" d="M495,242 L575,242"/><rect class="box" x="590" y="145" width="485" height="185" rx="12"/><text x="610" y="183" class="label">PUBLIC AGENT PRODUCTS</text><text x="610" y="220" class="small">Hydra public: coding-agent core</text><text x="610" y="248" class="small">BUCKS: paper-trading agent</text><text x="610" y="276" class="small">Useful capabilities without exporting</text><text x="610" y="304" class="small">the private installation or identity</text><rect class="box" x="45" y="405" width="440" height="170" rx="12"/><text x="65" y="443" class="label">PUBLIC-FACING CORPUS</text><text x="65" y="480" class="small">BACKS PLAY BOOK</text><text x="65" y="508" class="small">Plays, skills, essence, wireframes</text><text x="65" y="536" class="small">Repository currently PRIVATE</text><rect class="box" x="590" y="405" width="485" height="170" rx="12"/><text x="610" y="443" class="label">PUBLIC METHOD PACKAGE</text><text x="610" y="480" class="small">backs-aios-skills</text><text x="610" y="508" class="small">Portable methods, plays and commands</text><text x="610" y="536" class="small">Host adapters + grounding hooks</text><text x="45" y="655" class="label">Public / private is a distribution state, not a maturity ranking.</text></svg>