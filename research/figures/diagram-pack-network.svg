<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" role="img" aria-labelledby="t d"><title id="t">One purpose, several working bodies</title><desc id="d">Configured roles and interfaces, not a live traffic trace.</desc><style>:root{--paper:#f8f3e9;--ink:#17202a;--muted:#59636d;--cyan:#15a7bf;--cyan2:#0b6579;--orange:#d86f25;--green:#2d8564;--line:#afbcc4;--white:#fff}text{font-family:"Nimbus Sans Narrow",Arial,sans-serif;fill:var(--ink)}.title{font-size:34px;font-weight:700;letter-spacing:.5px}.sub{font-size:18px;fill:var(--muted)}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--white);stroke:var(--line);stroke-width:2}.signal{fill:var(--cyan);stroke:var(--cyan2);stroke-width:2}.accent{fill:var(--orange)}.ok{fill:var(--green)}.wire{fill:none;stroke:var(--cyan2);stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 7}text{font-size:23px}.label{font-size:25px}.small{font-size:21px}.sub{font-size:22px}.title{font-size:34px}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="var(--cyan2)"/></marker></defs><rect width="100%" height="100%" fill="var(--paper)"/><text x="45" y="60" class="title">One purpose, several working bodies</text><text x="45" y="99" class="sub">Configured roles and interfaces, not a live traffic trace.</text><rect class="box" x="45" y="145" width="410" height="135" rx="12"/><text x="65" y="183" class="label">THE OPERATOR</text><text x="65" y="220" class="small">Intent, correction, owned environment</text><text x="65" y="248" class="small">Chat · Telegram · console</text><path class="wire" d="M465,215 L540,215"/><rect class="box" x="550" y="145" width="525" height="135" rx="12"/><text x="570" y="183" class="label">ALPHA / BACKS</text><text x="570" y="220" class="small">Hub + Executive Team domains</text><text x="570" y="248" class="small">Plan, coordinate, synthesize, retain truth</text><path class="wire" d="M680,290 L290,355"/><path class="wire" d="M930,290 L840,355"/><rect class="box" x="45" y="365" width="475" height="155" rx="12"/><text x="65" y="403" class="label">BETA / CUZZOCLAW</text><text x="65" y="440" class="small">Operator wrapper around OpenClaw</text><text x="65" y="468" class="small">Content, media and tool work</text><text x="65" y="496" class="small">Own work lanes; structured receipt</text><rect class="box" x="590" y="365" width="485" height="155" rx="12"/><text x="610" y="403" class="label">SIGMA / HYDRA</text><text x="610" y="440" class="small">Private development peer</text><text x="610" y="468" class="small">Code, build, audit and reasoning</text><text x="610" y="496" class="small">Peer CLI; bounded assignment</text><path class="wire" d="M300,530 L300,580"/><path class="wire" d="M840,530 L840,580"/><rect class="box" x="45" y="590" width="1030" height="125" rx="12"/><text x="65" y="628" class="label">SHARED FABRIC + OWNED RESOURCES</text><text x="65" y="665" class="small">Signed messages · work board · operational memory · artifact evidence</text><text x="65" y="693" class="small">Browsers · files / archives · enrolled hosts · GPUs (capacity, not peers)</text></svg>