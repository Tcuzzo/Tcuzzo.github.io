<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Unsupported-evidence rates in a training corpus</title><desc id="d">Bar chart showing unsupported-evidence rates of 57.7 percent (176/305), 61.2 percent (260/425), and 13.7 percent (38/277).</desc><style>:root{--paper:#f8f3e9;--ink:#17202a;--muted:#59636d;--cyan:#15a7bf;--cyan2:#0b6579;--orange:#d86f25;--green:#2d8564;--line:#afbcc4;--white:#fff}text{font-family:"Nimbus Sans Narrow",Arial,sans-serif;fill:var(--ink)}.title{font-size:34px;font-weight:700;letter-spacing:.5px}.sub{font-size:18px;fill:var(--muted)}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--white);stroke:var(--line);stroke-width:2}.signal{fill:var(--cyan);stroke:var(--cyan2);stroke-width:2}.accent{fill:var(--orange)}.ok{fill:var(--green)}.wire{fill:none;stroke:var(--cyan2);stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b6579"/></marker></defs><rect width="100%" height="100%" fill="#f8f3e9"/><text class="title" x="70" y="70">The anti-hallucination corpus failed its own purpose</text><text class="sub" x="70" y="106">Rows citing evidence not supplied to the model, measured across the full corpus on July 18, 2026.</text><rect x="160" y="267.26" width="250" height="357.74" rx="8" class="accent"/><text class="label" x="230" y="245">57.7%</text><text class="label" x="230" y="675">GROUNDING</text><rect x="550" y="245.55999999999995" width="250" height="379.44000000000005" rx="8" class="accent"/><text class="label" x="620" y="224">61.2%</text><text class="label" x="620" y="675">APPLIED</text><rect x="940" y="540.06" width="250" height="84.94" rx="8" class="signal"/><text class="label" x="1010" y="518">13.7%</text><text class="label" x="1010" y="675">TRANSLATION</text><path class="dash" d="M110 625.0 H1280"/><text class="small" x="70" y="630.0">0%</text><path class="dash" d="M110 501.0 H1280"/><text class="small" x="70" y="506.0">20%</text><path class="dash" d="M110 377.0 H1280"/><text class="small" x="70" y="382.0">40%</text><path class="dash" d="M110 253.0 H1280"/><text class="small" x="70" y="258.0">60%</text><text class="small" x="70" y="750">Source: corrected full-corpus measurement in the July 18 evidence record. This is a case study of why verification is an organ.</text><text class="label" x="230" y="710">176 / 305 rows</text><text class="label" x="620" y="710">260 / 425 rows</text><text class="label" x="1010" y="710">38 / 277 rows</text></svg>